# Octa Docker Compose
#
# Usage (from project root):
#   Gateway bot:   docker compose --profile gateway up -d
#   Agent query:   docker compose --profile agent run --rm octa-agent -m "hello"
#   Logs:          docker compose logs -f octa-gateway
#   Stop:          docker compose --profile gateway down

services:
  # ─────────────────────────────────────────────
  # Octa Agent (one-shot query)
  #   docker compose --profile agent run --rm octa-agent -m "Hello"
  # ─────────────────────────────────────────────
  octa-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: octa:latest
    container_name: octa-agent
    profiles:
      - agent
    volumes:
      - octa-data:/root/.octa
    environment:
      - HOME=/root
    entrypoint: ["octa", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # Octa Gateway (Long-running Bot)
  #   docker compose --profile gateway up -d
  # ─────────────────────────────────────────────
  octa-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: octa:latest
    container_name: octa-gateway
    restart: unless-stopped
    profiles:
      - gateway
    ports:
      - "18790:18790"
    volumes:
      - octa-data:/root/.octa
    environment:
      - HOME=/root

volumes:
  octa-data:
